# Builds the packages and drafts the GitHub release, on a tag.
#
# This restores the packaging jobs `ci.yml` describes as removed. The reasoning
# that removed them still holds — a Tauri bundle is a quarter of an hour per
# platform — but it assumed the person cutting the release has a Rust toolchain
# and both targets to hand, and "wait fifteen minutes for a machine nobody is
# looking at" beats "no release at all" whenever that assumption fails.
#
# `scripts/release.sh` is unchanged and still works. Use it when you want the
# packages on your own disk, or when Actions is not an option; this is the path
# that needs nothing but a pushed tag.
#
# Windows is built on Windows here, which is what `scripts/build-windows.sh` says
# is the right answer for a release — its own cross-build exists so the target can
# be checked without a Windows machine, not because it is the better artifact.
#
# The release is left as a **draft**, exactly as the script leaves it: publishing
# stays a separate, deliberate click, so a bad upload is never public.
name: release

on:
  push:
    tags: ['v*']
  # For a re-run after a failed upload, or a tag pushed before this workflow
  # existed. The tag must already exist — nothing here creates one.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach to (e.g. v0.1.4)'
        required: true

# On a tag push `github.ref_name` *is* the tag; on a manual run it is the branch,
# so the input wins when there is one.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      # One platform failing must not cancel the others: a broken Windows bundler
      # should still leave the Linux packages downloadable from the run.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            bundle: src-tauri/target/release/bundle
          - os: windows-latest
            name: windows
            bundle: src-tauri/target/release/bundle
          # One universal .dmg rather than an Intel one and an Apple Silicon one.
          # It is the shape the rest of this release already has — a single asset
          # per platform — and it avoids the macos-13 runner, which is the only
          # way to build x86_64 natively and is on its way out. The cost is a
          # binary carrying both architectures, so a larger download.
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      # A universal binary is two compilations, so both targets have to exist —
      # the runner is arm64 and ships only its own.
      - name: Add the macOS targets
        if: matrix.name == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Deliberately uncached, unlike ci.yml. A release build is a different
      # profile from the test build, so the cache would mostly miss anyway — and
      # the thing it *would* carry between runs is a `target/` directory holding
      # older versions' bundles, which is the exact shape of the bug the version
      # scoping below exists to prevent. A release is cut rarely; correctness is
      # worth ten minutes here.

      - name: Install build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - run: bun install --frozen-lockfile

      # NO_STRIP is not optional on a current distribution — see the note in
      # scripts/release.sh. ubuntu-22.04's libraries predate the `.relr.dyn`
      # sections that break linuxdeploy's bundled `strip`, so this is insurance
      # against the runner image moving, not a fix for it today.
      - name: Build
        shell: bash
        run: NO_STRIP=true bun run tauri build ${{ matrix.args }}

      # Only this version's packages, matched loosely because every bundler spells
      # the version differently — `_0.1.4_amd64.deb`, `-0.1.4-1.x86_64.rpm`,
      # `_0.1.4_x64-setup.exe`. The glob that was not version-scoped once attached
      # four releases' worth of debs to one release.
      #
      # The `.msi` is built and not collected, matching every release so far: the
      # NSIS installer is the one Windows artifact this project ships.
      # NOT `dist/`: that is Vite's output directory (`frontendDist: "../dist"`),
      # which `tauri build` fills on its way past. Collecting into it shipped the
      # frontend bundle — index.html, favicon.svg and an `assets/` directory —
      # alongside the packages, and `gh release create` then failed on trying to
      # upload a directory as an asset.
      - name: Collect the packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${TAG#v}"
          b='${{ matrix.bundle }}'
          mkdir -p release-packages
          for f in "$b"/deb/*"$version"*.deb \
                   "$b"/rpm/*"$version"*.rpm \
                   "$b"/appimage/*"$version"*.AppImage \
                   "$b"/dmg/*"$version"*.dmg \
                   "$b"/nsis/*"$version"*.exe; do
            cp "$f" release-packages/
          done
          ls -l release-packages
          [ -n "$(ls -A release-packages)" ] ||
            { echo "no $version packages under $b" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: release-packages/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    # The only job that needs it, and the reason no `gh auth login` is involved:
    # the token Actions hands this workflow can write releases in its own repo.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-packages
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l release-packages

          # Every asset is a plain file. An artifact that somehow arrives as a
          # directory is a packaging mistake, and gh's error for it — "read
          # <path>: is a directory", thrown after some assets have already
          # uploaded — is a poor way to find out.
          for f in release-packages/*; do
            [ -f "$f" ] || { echo "not a file: $f" >&2; exit 1; }
          done

          cat > notes.md <<NOTES
          Built from \`$TAG\` by the release workflow.

          - \`.deb\` — Debian, Ubuntu and derivatives
          - \`.rpm\` — Fedora, RHEL and openSUSE
          - \`.AppImage\` — any other Linux, no install required
          - \`.dmg\` — macOS, universal (Apple Silicon and Intel)
          - \`.exe\` — Windows installer

          The Linux packages declare webkit2gtk 4.1 and GTK 3 as dependencies, so a
          package manager will pull them in.

          **The macOS and Windows builds are unsigned.** Windows SmartScreen will
          warn; choose More info → Run anyway. macOS Gatekeeper refuses outright,
          and the app is quarantined on download, so after dragging it to
          Applications run:

          \`\`\`
          xattr -dr com.apple.quarantine "/Applications/Work Alley.app"
          \`\`\`

          Signing needs an Apple Developer account and a Windows code-signing
          certificate; neither is set up for this project.
          NOTES

          # Re-runnable: an existing release — a draft from a failed attempt, or
          # one made by hand — gets its assets replaced rather than an error on a
          # name that is already taken.
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A half-finished run can leave assets this one is not about to
            # overwrite, and --clobber only replaces the names it uploads. On a
            # *draft* those are cleared: a draft is unpublished by definition, so
            # nothing can be depending on them, and a release that ships two
            # versions of itself is worse than one that lost a hand-attached file.
            # A published release is never touched this way — see release.sh,
            # which reports and leaves well alone for exactly that reason.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
              # Read line by line: every asset here is named "Work Alley_0.1.4…",
              # and a `for` over command substitution would split it at the space.
              keep=$(cd release-packages && ls)
              gh release view "$TAG" --json assets --jq '.assets[].name' |
                while IFS= read -r a; do
                  if ! grep -qxF "$a" <<<"$keep"; then
                    echo "removing stale asset: $a"
                    gh release delete-asset "$TAG" "$a" -y
                  fi
                done
            fi
            gh release upload "$TAG" release-packages/* --clobber
          else
            # --verify-tag: without it gh would create the tag at whatever the
            # default branch points to today, quietly shipping a release that is
            # not the commit it names.
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "Work Alley $TAG" \
              --notes-file notes.md \
              release-packages/*
          fi

          echo "--- assets now on $TAG ---"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
          gh release view "$TAG" --json url --jq .url
          echo "Publish it with:  gh release edit $TAG --draft=false"
