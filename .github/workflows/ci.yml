# The suites, on every push and pull request.
#
# Tests only. The packaging jobs live in `release.yml` and run on a tag, because
# they are the expensive part — a Tauri bundle is a quarter of an hour per
# platform, where these are seconds — and nothing about a branch push needs an
# installer.
#
# Only Linux runs here. The Windows job existed to produce installers; the parts
# of `src-tauri` behind `#[cfg(windows)]` are covered by `platform/mod.rs` keeping
# the logic pure and testable on any host — see the note at the top of that file.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on src-tauri, so a frontend-only change still gets a warm cache.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `cargo test` compiles the crate, and the crate links against GTK and
      # webkit2gtk through Tauri. No bundler dependencies are needed — nothing here
      # produces a package.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - run: bun install --frozen-lockfile

      - name: Test
        run: |
          bun test
          bun run lint
          cargo test --manifest-path src-tauri/Cargo.toml
