[package]
name = "work-alley"
version = "0.1.0"
description = "Work Alley — multi-repo workspace dashboard"
authors = ["Work Alley"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "work_alley_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
semver = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "sync",
  "time",
  "fs",
  "net",
] }
tauri-plugin-dialog = "2.7.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
incremental = true
