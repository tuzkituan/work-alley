[package]
name = "work-alley"
version = "0.1.0"
description = "Work Alley — multi-repo workspace dashboard"
authors = ["Work Alley"]
license = "MIT"
edition = "2021"
# A hard floor, not a guess. 1.77.2 is where `std::process::Command` started routing
# a `.bat`/`.cmd` program through `cmd.exe /c` with correct quoting. On Windows `npm`,
# `pnpm` and `yarn` are all `.cmd` shims, so dropping below this either breaks every
# npm-backed plan or reintroduces the argument-injection hazard those releases fixed.
# `platform::pty_argv` covers the same problem for portable-pty, whose ConPTY backend
# does *not* handle it.
rust-version = "1.77.2"

[lib]
name = "work_alley_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
semver = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "sync",
  "time",
  "fs",
  "net",
] }
tauri-plugin-dialog = "2.7.2"
# The integrated terminal. wezterm's; its unix backend already does setsid +
# TIOCSCTTY, so the child is a session leader and killpg reaches its whole tree.
portable-pty = "0.9"
# Terminal output is raw bytes and Tauri events are JSON. See pty::flush for why
# this is base64 and not from_utf8_lossy.
base64 = "0.22"
yaml-rust2 = "0.11.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Job objects, which are the only real analogue of `killpg` on Windows: a child's
# descendants join automatically, so `TerminateJobObject` reaches the whole tree.
# `taskkill /T` walks the *live* parent chain instead and therefore misses the
# orphan case this app exists to handle — vite spawning esbuild. Already in
# Cargo.lock via tokio and tauri, so this costs no new crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
# `tauri::test::mock_app` gives a real AppHandle, which is what lets the pty
# tests drive `pty::open` itself rather than a reimplementation of it.
tauri = { version = "2", features = ["test"] }

[profile.dev]
incremental = true
